<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Hero art (mockup): stylized brain, side view, in the logo palette.
       index.html layers the transparent TaLE MKE logo over the lower band.
       Swap for a lab photo later. -->
  <defs>
    <radialGradient id="glow" cx="0.58" cy="0.36" r="0.6">
      <stop offset="0" stop-color="#2b8ad6"/>
      <stop offset="1" stop-color="#0074c8"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#005a9c" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#005a9c" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#004f8a" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="brainClip">
      <path id="brainShape" d="M190 262 C176 196 214 132 286 100 C346 74 426 64 500 78 C582 94 652 134 684 198 C706 244 702 292 676 324 C662 342 640 352 616 356 C640 368 654 392 646 418 C636 448 598 462 560 454 C540 450 526 440 516 428 C512 452 508 478 500 506 L466 506 C472 476 474 448 470 422 C438 414 400 404 362 392 C318 378 270 362 236 336 C210 316 196 292 190 262 Z"/>
    </clipPath>
  </defs>

  <rect width="800" height="600" fill="#0074c8"/>
  <rect width="800" height="600" fill="url(#glow)" opacity="0.9"/>

  <g transform="translate(400 272) scale(1.06) translate(-448 -285)">
  <!-- Brain silhouette -->
  <use href="#brainShape" fill="#1283d0" stroke="#c1ddf4" stroke-width="4" stroke-linejoin="round"/>

  <!-- Gyri and sulci, clipped to the brain -->
  <g clip-path="url(#brainClip)" fill="none" stroke="#7eb8e0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- lateral (Sylvian) fissure -->
    <path d="M250 300 C300 286 352 284 398 272 C436 262 470 248 506 250" stroke="#c1ddf4" stroke-width="4.5"/>
    <!-- central sulcus -->
    <path d="M468 82 C458 118 474 140 458 172 C446 196 462 222 448 256" stroke="#c1ddf4" stroke-width="4.5"/>
    <!-- frontal folds -->
    <path d="M282 128 C300 150 280 172 304 190 C326 206 312 232 336 244"/>
    <path d="M232 196 C258 200 270 222 298 222"/>
    <path d="M350 96 C360 124 344 142 366 162 C386 180 372 204 394 222"/>
    <path d="M410 86 C416 112 400 132 418 152 C434 170 420 194 432 214"/>
    <path d="M214 262 C240 256 262 270 286 262"/>
    <!-- parietal / occipital folds -->
    <path d="M512 92 C516 120 500 140 518 162 C534 182 520 206 536 228"/>
    <path d="M566 108 C566 136 552 152 570 174 C586 194 572 218 592 238"/>
    <path d="M622 142 C618 168 606 180 622 202 C636 222 628 246 646 262"/>
    <path d="M548 262 C574 256 596 272 624 266 C650 260 664 276 684 272"/>
    <path d="M560 310 C584 302 606 318 632 310"/>
    <!-- temporal folds -->
    <path d="M292 330 C330 322 352 338 390 328 C420 320 444 334 474 326"/>
    <path d="M340 364 C372 356 394 372 428 362 C452 356 470 368 494 362"/>
    <path d="M500 282 C522 294 520 318 548 322"/>
  </g>

  <!-- Cerebellum folia -->
  <g fill="none" stroke="#7eb8e0" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M540 372 C572 368 604 376 628 392"/>
    <path d="M532 392 C566 388 600 398 634 414"/>
    <path d="M536 414 C566 412 596 422 626 436"/>
  </g>
  </g>

  <!-- Darken the lower band so the overlaid logo reads clearly -->
  <rect width="800" height="600" fill="url(#base)"/>

</svg>
